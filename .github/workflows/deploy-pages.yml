name: Deploy PayGuard frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Configure API origin
        env:
          PAYGUARD_API_BASE: ${{ secrets.PAYGUARD_API_BASE }}
        run: |
          if [ -n "$PAYGUARD_API_BASE" ]; then
            printf 'window.PAYGUARD_API_BASE = "%s";\\n' "$PAYGUARD_API_BASE" > public/config.js
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
